services:
  db:
    image: mysql:8.0
    container_name: pasajes_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pasajes_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pasajes_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/pasajes_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: